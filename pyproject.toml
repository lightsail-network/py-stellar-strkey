[project]
name = "stellar-strkey"
version = "0.1.0"
description = "Strict, typed, dependency-free encoding and decoding of Stellar strkeys (SEP-23)."
readme = "README.md"
authors = [{ name = "overcat", email = "hi@overcat.dev" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["stellar", "strkey", "sep-23", "base32", "soroban"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Free Threading :: 3 - Stable",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/lightsail-network/py-stellar-strkey"
Documentation = "https://stellar-strkey.readthedocs.io/"
Repository = "https://github.com/lightsail-network/py-stellar-strkey"
Issues = "https://github.com/lightsail-network/py-stellar-strkey/issues"
Changelog = "https://github.com/lightsail-network/py-stellar-strkey/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    { include-group = "test" },
    "git-cliff>=2.14.2",
    "mypy>=2.4",
    "prek>=0.5",
    "pyright[nodejs]>=1.1.414",
    "ruff>=0.17",
    "zizmor>=1.32",
]
test = [
    "hypothesis>=6.170",
    "pytest>=9.2",
    "pytest-cov>=7.1",
]
docs = [
    "mkdocstrings-python>=2.0.10",
    "zensical>=0.0.74",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Ship the tests with the source distribution so that downstream packagers can run them.
# The docs are included because the tests run their examples. docs/changelog.md is a
# build-time copy of CHANGELOG.md.
source-include = ["tests/**", "docs/**", "CHANGELOG.md"]
source-exclude = ["docs/changelog.md"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812", # conflicts with the formatter
    "CPY001", # the LICENSE file covers the whole package
    "D105",   # dunder methods are self-explanatory
    "D107",   # the class docstring documents construction
    "TRY003", # short, specific exception messages read better inline
    "EM101",  # as above
    "EM102",  # as above
]

[tool.ruff.lint.per-file-ignores]
"src/stellar_strkey/_keys.py" = [
    "A002", # `id` and `hash` are the natural names of these parameters
]
"tests/**" = [
    "D",       # test names are the documentation
    "ANN401",  # tests deliberately pass arbitrary objects
    "PLR2004", # literal expectations are the point of a test
    "S101",    # pytest uses assert
    "S301",    # pickle round trips of our own objects
    "A002",    # mirrors the field names under test
    "SLF001",  # white-box assertions
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.11"

[tool.pytest]
minversion = "9.0"
testpaths = ["tests"]
strict = true
addopts = ["-ra"]

[tool.coverage.run]
branch = true
source_pkgs = ["stellar_strkey"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:"]
